    :root {
      --bg-dark: #0f0f11;
      --card-bg: #18181c;
      --card-border: #26262e;
      --primary-gold: #f59e0b;
      --gold-hover: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-eeka: #f97316;
      --accent-elly: #ec4899;
      --accent-zach: #3b82f6;
      --accent-bedsy: #10b981;
      --accent-scottie: #a855f7;
      --accent-alex: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header Banner */
    .header-card {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      border-radius: 16px;
      padding: 1.5rem;
      color: #000;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3);
      position: relative;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .icon-badge {
      width: 48px;
      height: 48px;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .header-titles h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-badge {
      display: inline-block;
      background: #000;
      color: #f59e0b;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .header-sub {
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      opacity: 0.9;
      margin-bottom: 1rem;
    }

    .tz-controls {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      backdrop-filter: blur(4px);
    }

    .tz-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
    }

    select {
      background: #000;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .tz-badge {
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Top Active & Upcoming Widgets Container */
    .top-widgets-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scroll-snap-type: x mandatory;
    }

    .hero-card {
      flex: 1 0 280px;
      max-width: 100%;
      scroll-snap-align: start;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-gold), var(--accent-eeka));
    }

    .hero-card.ongoing::before {
      background: linear-gradient(90deg, #ef4444, #f59e0b);
    }

    .hero-label {
      display: inline-block;
      background: var(--primary-gold);
      color: #000;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      width: fit-content;
    }

    .hero-label.active-live {
      background: #ef4444;
      color: #fff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .hero-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .hero-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .hero-timer-box {
      background: #101014;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 0.85rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      text-align: center;
    }

    .timer-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-val {
      font-size: 1.35rem;
      font-weight: 900;
      font-family: monospace;
      color: var(--primary-gold);
    }

    .timer-val.active-live-val {
      color: #ef4444;
    }

    .timer-lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Filter Controls */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary-gold);
    }

    .teacher-pills {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .pill.active, .pill:hover {
      background: var(--primary-gold);
      color: #000;
      border-color: var(--primary-gold);
    }

    /* Timetable Grid */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .day-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .class-count {
      font-size: 0.65rem;
      font-weight: 800;
      background: var(--primary-gold);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .class-list {
      display: flex;
      flex-direction: column;
    }

    .class-item {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .class-item.ongoing {
      background: rgba(239, 68, 68, 0.08);
      border-left: 3px solid #ef4444;
    }

    .class-item:last-child {
      border-bottom: none;
    }

    .class-time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
    }

    .class-subject {
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
    }

    .class-teacher {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
      text-transform: uppercase;
    }

    .badge-eeka { background: rgba(249, 115, 22, 0.2); color: var(--accent-eeka); border: 1px solid var(--accent-eeka); }
    .badge-elly { background: rgba(236, 72, 153, 0.2); color: var(--accent-elly); border: 1px solid var(--accent-elly); }
    .badge-zach { background: rgba(59, 130, 246, 0.2); color: var(--accent-zach); border: 1px solid var(--accent-zach); }
    .badge-bedsy { background: rgba(16, 185, 129, 0.2); color: var(--accent-bedsy); border: 1px solid var(--accent-bedsy); }
    .badge-scottie { background: rgba(168, 85, 247, 0.2); color: var(--accent-scottie); border: 1px solid var(--accent-scottie); }
    .badge-alex { background: rgba(6, 182, 212, 0.2); color: var(--accent-alex); border: 1px solid var(--accent-alex); }

      font-size: 0.65rem;
      font-weight: 800;
      color: var(--primary-gold);

    .live-badge.ongoing-text {
      color: #ef4444;
      animation: pulse 1.5s infinite;

    .live-badge.ended-text {
      color: #4b5563;
    }

    .footer {
      margin-top: 1.5rem;
      padding: 1rem 0;
      text-align: center;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .widget-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .static-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .discord-btn {
      background: #5865F2;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .discord-widget-container {
      width: 100%;
      max-width: 350px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .discord-widget-container iframe {
      width: 100%;
      height: 250px;
      border: none;
      display: block;
    }
  </style>
</head>

    let currentTz = "AUTO";
    let activeFilter = "ALL";
    const CLASS_DURATION_MS = 60 * 60 * 1000;

    function parseUtcDate(dayStr, timeStr) {
      const match = dayStr.match(/(\d{2})\s+NOV/);
      const dayNum = match ? parseInt(match[1]) : 10;
      const [hh, mm] = timeStr.split(":").map(Number);
      return new Date(Date.UTC(2026, 10, dayNum, hh, mm, 0));
    }

    function getResolvedTz() {
      if (currentTz === "AUTO") {
        try {
          return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        } catch(e) {
          return "UTC";
        }
      }
      return currentTz;
    }

    function getTeacherBadgeClass(teacher) {
      if (teacher.includes("EEKA")) return "badge-eeka";
      if (teacher.includes("ELLY")) return "badge-elly";
      if (teacher.includes("ZACH")) return "badge-zach";
      if (teacher.includes("BEDSY")) return "badge-bedsy";
      if (teacher.includes("SCOTTIE")) return "badge-scottie";
      return "badge-alex";
    }

    function formatTimeDiff(ms) {
      const totalSec = Math.floor(Math.abs(ms) / 1000);
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      if (days > 0) {
        return `${days}d ${String(hours).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m ${String(secs).padStart(2, '0')}s`;
      }
      return `${String(hours).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m ${String(secs).padStart(2, '0')}s`;
    }

    function updateHeroWidgets() {
      const now = new Date();
      const tz = getResolvedTz();
      const container = document.getElementById("topWidgetsContainer");
      
      const liveClasses = [];
      const upcomingClasses = [];

      rawSchedule.forEach(group => {
        group.items.forEach(item => {
          const startUtc = parseUtcDate(group.day, item.time);
          const endUtc = new Date(startUtc.getTime() + CLASS_DURATION_MS);

          if (now >= startUtc && now < endUtc) {
            liveClasses.push({ ...item, startUtc, endUtc });
          } else if (startUtc > now) {
            upcomingClasses.push({ ...item, startUtc, endUtc });
          }
        });
      });

      // Sort upcoming classes by start time
      upcomingClasses.sort((a, b) => a.startUtc - b.startUtc);

      // Select top active classes and next 2 upcoming classes
      const displayClasses = [
        ...liveClasses.map(c => ({ ...c, isLive: true })),
        ...upcomingClasses.slice(0, 2).map(c => ({ ...c, isLive: false }))
      ];

      if (displayClasses.length === 0) {
        container.innerHTML = `
          <div class="hero-card" style="flex:1;">
            <div class="hero-label">TIMETABLE CONCLUDED</div>
            <div class="hero-title">All Classes Completed</div>
            <div class="hero-meta">November 2026 Schedule Concluded</div>
          </div>
        `;
        return;
      }

      container.innerHTML = displayClasses.map(item => {
        const localTimeStr = item.startUtc.toLocaleTimeString("en-US", {
          timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false
        });
        const localDateStr = item.startUtc.toLocaleDateString("en-US", {
          timeZone: tz, weekday: 'short', month: 'short', day: '2-digit'
        });

        if (item.isLive) {
          const remainingMs = item.endUtc - now;
          return `
            <div class="hero-card ongoing">
              <div>
                <div class="hero-label active-live">🔴 LIVE NOW</div>
                <div class="hero-title">${item.title} (${item.teacher})</div>
                <div class="hero-meta">Started at ${localTimeStr} (${tz})</div>
              </div>
              <div class="hero-timer-box">
                <div class="timer-col">
                  <div class="timer-val active-live-val">${formatTimeDiff(remainingMs)}</div>
                  <div class="timer-lbl">ENDS IN</div>
                </div>
                <div class="timer-col">
                  <div class="timer-val">${localTimeStr}</div>
                  <div class="timer-lbl">LOCAL TIME</div>
                </div>
              </div>
            </div>
          `;
        } else {
          const diffMs = item.startUtc - now;
          return `
            <div class="hero-card">
              <div>
                <div class="hero-label">NEXT UPCOMING</div>
                <div class="hero-title">${item.title} (${item.teacher})</div>
                <div class="hero-meta">${localDateStr} at ${localTimeStr} (${tz})</div>
              </div>
              <div class="hero-timer-box">
                <div class="timer-col">
                  <div class="timer-val">${formatTimeDiff(diffMs)}</div>
                  <div class="timer-lbl">STARTS IN</div>
                </div>
                <div class="timer-col">
                  <div class="timer-val">${localTimeStr}</div>
                  <div class="timer-lbl">LOCAL TIME</div>
                </div>
              </div>
            </div>
          `;
        }
      }).join("");
    }

    function renderTimetable() {
      const tz = getResolvedTz();
      document.getElementById("activeTzBadge").textContent = `Active TZ: ${tz}`;
      const search = document.getElementById("searchInput").value.toLowerCase();
      const grid = document.getElementById("scheduleGrid");
      grid.innerHTML = "";
      const now = new Date();

      rawSchedule.forEach(group => {
        const filteredItems = group.items.filter(item => {
          const matchTeacher = activeFilter === "ALL" || item.teacher.includes(activeFilter);
          const matchSearch = item.title.toLowerCase().includes(search) || item.teacher.toLowerCase().includes(search);
          return matchTeacher && matchSearch;
        });

        if (filteredItems.length === 0) return;

        const dayCard = document.createElement("div");
        dayCard.className = "day-card";

        const headerDate = parseUtcDate(group.day, "12:00");
        const formattedHeaderDate = headerDate.toLocaleDateString("en-US", {
          timeZone: tz,
          weekday: 'short',
          day: '2-digit',
          month: 'short'
        }).toUpperCase();

        let itemsHtml = "";
        filteredItems.forEach(item => {
          const startUtc = parseUtcDate(group.day, item.time);
          const endUtc = new Date(startUtc.getTime() + CLASS_DURATION_MS);

          const startStr = startUtc.toLocaleTimeString("en-US", {
            timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false
          });
          const endStr = endUtc.toLocaleTimeString("en-US", {
            timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false
          });

          let badgeHtml = "";
          let ongoingClass = "";

          if (now >= startUtc && now < endUtc) {
            ongoingClass = "ongoing";
            const endDiffMs = endUtc - now;
            badgeHtml = `<span class="live-badge ongoing-text">🔴 LIVE • Ends in ${formatTimeDiff(endDiffMs)}</span>`;
          } else if (startUtc > now) {
            const startDiffMs = startUtc - now;
            badgeHtml = `<span class="live-badge">Starts in ${formatTimeDiff(startDiffMs)}</span>`;
          } else {
            badgeHtml = `<span class="live-badge ended-text">Completed</span>`;
          }

          itemsHtml += `
            <div class="class-item ${ongoingClass}">
              <div class="class-time-row">
                <span>${startStr} - ${endStr}</span>
                ${badgeHtml}
              </div>
              <div class="class-subject">${item.title}</div>
              <span class="class-teacher ${getTeacherBadgeClass(item.teacher)}">${item.teacher}</span>
            </div>
          `;
        });

        dayCard.innerHTML = `
          <div class="day-header">
            <span class="day-title">${formattedHeaderDate}</span>
            <span class="class-count">${filteredItems.length} CLASSES</span>
          </div>
          <div class="class-list">${itemsHtml}</div>
        `;

        grid.appendChild(dayCard);
      });
    }

    function filterTeacher(teacher, el) {
      activeFilter = teacher;
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      el.classList.add("active");
      renderTimetable();
    }

    function changeTimezone(val) {
      currentTz = val;
      renderTimetable();
      updateHeroWidgets();
    }

    function copyDiscord() {
      navigator.clipboard.writeText("nxgativx");
      alert("Copied Discord handle: nxgativx");
    }

    function initApp() {
      renderTimetable();
      updateHeroWidgets();
      setInterval(() => {
        updateHeroWidgets();
        renderTimetable();
      }, 1000);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
